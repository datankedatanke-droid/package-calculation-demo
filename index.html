<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>套餐推算 - 智慧售电管理系统</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#303133;background:#f3f5f7;font:14px "Microsoft YaHei",Arial,sans-serif}.app{display:flex;min-height:100vh}.side{width:200px;background:#2f4056;color:#bfcbd9;flex:none}.logo{height:56px;display:flex;align-items:center;padding-left:18px;color:#fff;font-size:16px;font-weight:600;border-bottom:1px solid #26384e}.logo i{font-style:normal;border:1px solid #66b1ff;background:#409eff;width:23px;height:23px;line-height:21px;text-align:center;border-radius:3px;margin-right:9px}.menu-group{padding:17px 17px 7px;font-size:12px;color:#8492a6}.menu{margin:0;padding:0 8px;list-style:none}.menu li{height:46px;display:flex;align-items:center;padding:0 13px;cursor:pointer;border-radius:2px}.menu li:hover{background:#26384f}.menu li.active{background:#409eff;color:#fff}.mi{width:23px;font-size:15px}.main{min-width:930px;flex:1}.top{height:56px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #e4e7ed}.crumb{color:#606266}.crumb b{color:#303133;font-weight:400}.top-right{color:#606266}.tabs{height:36px;background:#fff;border-bottom:1px solid #dcdfe6;display:flex;align-items:flex-end;padding-left:15px}.tab{height:30px;padding:7px 14px;border:1px solid #dcdfe6;border-bottom:0;background:#fff;color:#409eff;border-top:2px solid #409eff}.content{padding:15px 16px 28px}.page-title{font-size:16px;margin-bottom:12px}.card{background:#fff;border:1px solid #e4e7ed;margin-bottom:14px}.card-title{height:42px;line-height:42px;padding:0 15px;font-weight:600;border-bottom:1px solid #e4e7ed}.card-body{padding:15px}.form{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}.field{display:flex;align-items:center}.field label{width:80px;text-align:right;margin-right:8px;color:#606266}.input,.picker{height:32px;width:190px;border:1px solid #dcdfe6;border-radius:3px;padding:0 10px;display:flex;align-items:center;background:#fff;color:#606266}.picker{justify-content:space-between;position:relative;cursor:pointer}.picker input{border:0;outline:0;width:145px;color:#606266;font:inherit}.drop{display:none;position:absolute;z-index:9;top:34px;left:0;width:100%;padding:5px 0;background:#fff;border:1px solid #e4e7ed;box-shadow:0 2px 12px rgba(0,0,0,.12)}.picker.open .drop{display:block}.option{padding:8px 10px}.option:hover{background:#f5f7fa;color:#409eff}.btn{height:32px;padding:0 13px;border:1px solid #dcdfe6;background:#fff;border-radius:3px;color:#606266;cursor:pointer;margin-right:8px}.btn:hover{color:#409eff;border-color:#b3d8ff;background:#ecf5ff}.primary{background:#409eff;color:#fff;border-color:#409eff}.primary:hover{background:#66b1ff;color:#fff}.toolbar{display:flex;justify-content:space-between;margin-bottom:12px}.tools{color:#909399;font-size:17px}.tabs2{height:40px;border-bottom:1px solid #e4e7ed;margin-bottom:14px}.tabs2 span{display:inline-block;height:40px;padding:11px 18px;cursor:pointer}.tabs2 .on{color:#409eff;border-bottom:2px solid #409eff}.table-wrap{overflow:auto}.table{border-collapse:collapse;width:100%;min-width:820px}.table th,.table td{height:40px;padding:8px 12px;border:1px solid #ebeef5;text-align:left;white-space:nowrap}.table th{background:#f5f7fa;color:#909399;font-weight:500}.table tr:hover td{background:#f5f7fa}.tag{display:inline-block;padding:3px 7px;border-radius:3px;font-size:12px}.green{color:#67c23a;background:#f0f9eb}.blue{color:#409eff;background:#ecf5ff}.yellow{color:#e6a23c;background:#fdf6ec}.link{color:#409eff;cursor:pointer;margin-right:10px}.notice{padding:9px 12px;border:1px solid #faecd8;background:#fdf6ec;color:#e6a23c;margin-bottom:12px;border-radius:3px}.desc{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #ebeef5;margin-bottom:14px}.desc div{padding:10px 14px;border-right:1px solid #ebeef5;border-bottom:1px solid #ebeef5}.desc label{color:#909399;margin-right:12px}.desc b{font-weight:500}.em{color:#67c23a;font-size:16px}.pagination{display:flex;justify-content:flex-end;align-items:center;gap:7px;margin-top:15px;color:#606266}.pg{min-width:30px;height:28px;line-height:26px;text-align:center;border:1px solid #dcdfe6;border-radius:2px}.pg.active{color:#fff;background:#409eff;border-color:#409eff}.drawer-mask{display:none;position:fixed;z-index:20;inset:0;background:rgba(0,0,0,.28)}.drawer-mask.show{display:block}.drawer{position:absolute;right:0;top:0;width:520px;height:100%;background:#fff;box-shadow:-3px 0 12px rgba(0,0,0,.18)}.drawer h3{margin:0;padding:17px 20px;border-bottom:1px solid #e4e7ed;font-size:16px}.drawer .body{padding:20px}.row{display:flex;align-items:center;margin-bottom:16px}.row label{width:110px;text-align:right;margin-right:10px;color:#606266}.row .input{width:300px}.drawer-foot{position:absolute;bottom:0;left:0;right:0;padding:12px 20px;text-align:right;border-top:1px solid #e4e7ed}.msg{display:none;position:fixed;z-index:30;top:70px;left:50%;transform:translateX(-50%);padding:10px 15px;color:#67c23a;background:#f0f9eb;border:1px solid #e1f3d8;border-radius:3px}.msg.warn{color:#e6a23c;background:#fdf6ec;border-color:#faecd8}@media(max-width:1100px){.main{min-width:760px}.desc{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div class="app"><aside class="side"><div class="logo"><i>能</i>智慧售电管理系统</div><div class="menu-group">测算配置</div><ul class="menu"><li data-page="electric"><span class="mi">▦</span>客户电量维护</li><li data-page="plan"><span class="mi">▤</span>客户套餐</li><li data-page="template"><span class="mi">▧</span>客户电价模版</li><li data-page="calc" class="active"><span class="mi">▣</span>套餐推算</li></ul></aside>
<main class="main"><header class="top"><div class="crumb">首页　/　测算配置　/　<b id="crumb">套餐推算</b></div><div class="top-right">🔍　🔔　管理员 ▾</div></header><div class="tabs"><div class="tab" id="tab">套餐推算　×</div></div><div class="content" id="content"></div></main></div>
<div class="drawer-mask" id="drawer"><div class="drawer"><h3 id="drawer-title">新增</h3><div class="body" id="drawer-body"></div><div class="drawer-foot"><button class="btn" onclick="closeDrawer()">取消</button><button class="btn primary" onclick="saveDrawer()">确定</button></div></div></div><div class="msg" id="msg"></div>
<script>
const S={page:'calc',client:'宁夏示例客户A',tpl:'峰时调整模版',date:'2026-09-19',tab:'result'};const clients=['宁夏示例客户A','宁夏示例客户B'];
function toast(t,w){let e=document.querySelector('#msg');e.textContent=t;e.className='msg'+(w?' warn':'');e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function picker(k,v,opts,editable){return `<div class="picker" onclick="this.classList.toggle('open')">${editable?`<input value="${v}" onclick="event.stopPropagation()" oninput="S.${k}=this.value">`:`<span>${v}</span>`}<span>⌄</span><div class="drop">${opts.map(x=>`<div class="option" onclick="event.stopPropagation();S.${k}='${x}';render()">${x}</div>`).join('')}</div></div>`}
function page(title,html){document.querySelector('#crumb').textContent=title;document.querySelector('#tab').textContent=title+'　×';document.querySelector('#content').innerHTML=`<div class="page-title">${title}</div>${html}`}
function pagination(n){return `<div class="pagination"><span>共 ${n} 条</span><span class="pg">‹</span><span class="pg active">1</span><span class="pg">2</span><span class="pg">›</span><span>10条/页⌄</span><span>前往 <span class="pg">1</span> 页</span></div>`}
function listPage(kind){let data={electric:{title:'客户电量维护',fields:['客户名称','月份'],buttons:['＋ 导入电量','⇩ 导出缺失数据'],heads:['客户名称','日期','00:00–01:00','08:00–09:00','17:00–18:00','23:00–24:00','状态','操作'],rows:[['宁夏示例客户A','2026-09-15','4.27','5.53','6.41','3.89','<span class="tag green">完整</span>','<span class="link">查看</span><span class="link">删除</span>'],['宁夏示例客户A','2026-09-14','4.18','5.47','6.32','3.80','<span class="tag green">完整</span>','<span class="link">查看</span><span class="link">删除</span>']]},plan:{title:'客户套餐',fields:['套餐名称','关联客户'],buttons:['＋ 新增套餐'],heads:['套餐名称','价格年月','关联客户数','客户套餐有效期','状态','操作'],rows:[['常规零售套餐','2026年09月（24时段）','2','客户A：2026-01-01 至 2026-12-31','<span class="tag green">启用</span>','<span class="link">编辑</span><span class="link" onclick="openDrawer(\'复制套餐\')">复制套餐</span><span class="link">关联客户</span>'],['峰时优惠套餐','2026年09月（24时段）','1','客户B：2026-07-01 至 2026-12-31','<span class="tag green">启用</span>','<span class="link">编辑</span><span class="link" onclick="openDrawer(\'复制套餐\')">复制套餐</span>']]},template:{title:'客户电价模版',fields:['模版名称','关联客户'],buttons:['＋ 新增电价模版'],heads:['模版名称','价格年月','关联客户','客户模版生效日期','状态','操作'],rows:[['常规价格模版','2026年09月（24时段）','宁夏示例客户A、客户B','客户A：2026-09-01；客户B：2026-09-01','<span class="tag green">生效中</span>','<span class="link">编辑</span><span class="link">关联客户</span>'],['峰时调整模版','2026年09月（24时段）','宁夏示例客户A','客户A：2026-09-19','<span class="tag blue">待生效</span>','<span class="link">编辑</span><span class="link">关联客户</span>']]}}[kind];page(data.title,`<section class="card module-query"><div class="card-body"><div class="form">${data.fields.map((x,i)=>`<div class="field"><label>${x}</label><div class="input">${i?'请选择':'请输入'+x}</div></div>`).join('')}<button class="btn primary" onclick="toast('查询成功')">查询</button><button class="btn" onclick="toast('已重置查询条件')">重置</button></div></div></section><section class="card module-list"><div class="card-body"><div class="toolbar"><div>${data.buttons.map((x,i)=>`<button class="btn ${i?'':'primary'}" onclick="openDrawer('${x.replace('＋ ','')}')">${x}</button>`).join('')}</div><div class="tools">⟳　▦</div></div><div class="table-wrap"><table class="table"><thead><tr>${data.heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${data.rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${pagination(data.rows.length)}</div></section>`) }
function calc(){let same=S.tpl==='常规价格模版';page('套餐推算',`<section class="card"><div class="card-title">客户信息</div><div class="card-body"><div class="form"><div class="field"><label>客户名称</label>${picker('client',S.client,clients,true)}</div><div class="field"><label>推算月份</label><div class="input">2026-09　📅</div></div><div class="field"><label>当前生效模版</label><div class="input">常规价格模版</div></div><div class="field"><label>实际电量日期</label><div class="input">2026-09-01 至 2026-09-15</div></div></div></div></section><section class="card"><div class="card-title">套餐情况</div><div class="card-body"><div class="form"><div class="field"><label>本次改价模版</label>${picker('tpl',S.tpl,['峰时调整模版','常规价格模版'])}</div><div class="field"><label>客户生效日期</label><div class="input">${S.date}　📅</div></div><button class="btn primary" onclick="runCalc()">推算套餐</button><button class="btn" onclick="exportTpl()">导出最终电价模版</button></div></div></section>${same?'<div class="notice">⚠ 改价模版与当前生效中模版一致</div>':''}<section class="card"><div class="card-title">套餐推算结果</div><div class="card-body"><div class="tabs2"><span class="${S.tab==='result'?'on':''}" onclick="S.tab='result';render()">推算结果</span><span class="${S.tab==='detail'?'on':''}" onclick="S.tab='detail';render()">收入取价明细</span></div>${S.tab==='result'?resultTable():detailTable()}</div></section>`) }
function resultTable(){return `<div class="desc"><div><label>已上传日期</label><b>15 天</b></div><div><label>缺失日期</label><b>15 天</b></div><div><label>完整月分时总电量</label><b>3,406.86 MWh</b></div><div><label>当月总成本</label><b>1,053,795.31 元</b></div><div><label>补全规则</label><b>同小时位日均补全</b></div><div><label>成本口径</label><b>改价前后相同</b></div></div><div class="table-wrap"><table class="table"><thead><tr><th>指标</th><th>改价前</th><th>改价后</th><th>改价影响</th></tr></thead><tbody><tr><td>总收入（元）</td><td>1,072,106.70</td><td>1,097,991.90</td><td class="em">+25,885.20</td></tr><tr><td>总成本（元）</td><td>1,053,795.31</td><td>1,053,795.31</td><td>0.00</td></tr><tr><td>总盈亏（元）</td><td>18,311.39</td><td>44,196.59</td><td class="em">+25,885.20</td></tr><tr><td>度电收入（元/MWh）</td><td>314.69</td><td>322.29</td><td class="em">+7.60</td></tr><tr><td>度电盈亏（元/MWh）</td><td>5.37</td><td>12.97</td><td class="em">+7.60</td></tr></tbody></table></div>`}
function detailTable(){return `<div class="table-wrap"><table class="table"><thead><tr><th>日期区间</th><th>电量类型</th><th>价格来源</th><th>适用时段</th><th>电价（元/MWh）</th><th>收入计算</th></tr></thead><tbody><tr><td>2026-09-01 至 2026-09-15</td><td>实际电量</td><td>常规价格模版</td><td>全部24时段</td><td>285.00–365.00</td><td>日分时电量 × 模版价格</td></tr><tr><td>2026-09-16 至 2026-09-18</td><td>补全电量</td><td>常规价格模版</td><td>全部24时段</td><td>285.00–365.00</td><td>日均补全电量 × 模版价格</td></tr><tr><td>2026-09-19 至 2026-09-30</td><td>补全电量</td><td>${S.tpl}</td><td>全部24时段</td><td>295.00–405.00</td><td>日均补全电量 × 新模版价格</td></tr></tbody></table></div>`}
function runCalc(){if(!clients.includes(S.client)){toast('未查询到该客户的实际电量，请先上传','warn');return}toast('套餐推算完成')};function exportTpl(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['客户名称,模版名称,客户生效日期\n'+S.client+','+S.tpl+','+S.date],{type:'text/csv'}));a.download='最终电价模版.csv';a.click();toast('已导出最终电价模版')}
function openDrawer(t){document.querySelector('#drawer-title').textContent=t;document.querySelector('#drawer-body').innerHTML=`<div class="row"><label>名称</label><div class="input">${t==='复制套餐'?'常规零售套餐（复制）':'请输入名称'}</div></div><div class="row"><label>价格年月</label><div class="input">2026年09月　📅</div></div><div class="row"><label>关联客户</label>${picker('client',S.client,clients)}</div><div class="notice">分时价格为 24 个小时位，单位元/MWh，保留两位小数。</div>`;document.querySelector('#drawer').classList.add('show')};function closeDrawer(){document.querySelector('#drawer').classList.remove('show')};function saveDrawer(){closeDrawer();toast('保存成功')}
function render(){document.querySelectorAll('.menu li').forEach(x=>x.classList.toggle('active',x.dataset.page===S.page));if(S.page==='calc')calc();else listPage(S.page)}document.querySelectorAll('.menu li').forEach(x=>x.onclick=()=>{S.page=x.dataset.page;render()});document.addEventListener('click',e=>{if(!e.target.closest('.picker'))document.querySelectorAll('.picker').forEach(x=>x.classList.remove('open'))});render();
</script></body></html>
