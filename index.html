  <style>
    *{box-sizing:border-box} body{margin:0;background:#f5f7fa;color:#303133;font:14px -apple-system,BlinkMacSystemFont,"Microsoft YaHei",Arial,sans-serif}.app{display:flex;min-height:100vh}.sidebar{width:208px;background:#2f4056;color:#bfcbd9;flex:none}.brand{height:58px;display:flex;align-items:center;padding:0 19px;color:#fff;font-size:17px;font-weight:600;background:#26384f}.brand b{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:3px;background:#409eff;margin-right:9px;font-size:13px}.nav-title{padding:17px 18px 7px;color:#8391a5;font-size:12px}.nav{padding:0 8px}.nav-item{height:48px;display:flex;align-items:center;padding:0 12px;border-radius:2px;cursor:pointer;margin-bottom:2px}.nav-item:hover{background:#26384f}.nav-item.active{background:#409eff;color:#fff}.nav-icon{width:22px;font-size:16px}.main{flex:1;min-width:900px}.topbar{height:58px;background:#fff;border-bottom:1px solid #e7eaef;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.crumb{color:#606266}.crumb span{margin:0 7px;color:#c0c4cc}.user{color:#606266}.tabs{height:40px;background:#fff;border-bottom:1px solid #dfe4ed;padding-left:18px;display:flex;align-items:flex-end}.tab{height:32px;padding:8px 15px;border:1px solid #dcdfe6;border-bottom:0;border-radius:3px 3px 0 0;color:#606266;background:#fafafa}.tab.active{background:#fff;color:#409eff;border-top:2px solid #409eff;padding-top:7px}.content{padding:16px 18px 28px}.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.page-title{font-size:18px;color:#303133;font-weight:600}.subtle{color:#909399;font-size:13px}.panel{background:#fff;border:1px solid #ebeef5;margin-bottom:14px}.panel-hd{height:44px;border-bottom:1px solid #ebeef5;padding:0 16px;display:flex;align-items:center;font-weight:600}.panel-bd{padding:16px}.query{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:end}.field{display:flex;align-items:center;gap:8px;min-height:32px}.field label{color:#606266;white-space:nowrap}.input,.select-box{height:32px;width:190px;border:1px solid #dcdfe6;border-radius:3px;background:#fff;padding:0 10px;display:flex;align-items:center;justify-content:space-between;color:#606266}.input:focus{outline:1px solid #409eff}.select-box{cursor:pointer;position:relative}.select-box .arrow{font-size:11px;color:#909399}.select-input{border:0;outline:0;width:154px;height:28px;color:#606266;font:inherit;background:transparent}.select-options{display:none;position:absolute;z-index:8;left:0;top:35px;width:100%;background:#fff;border:1px solid #e4e7ed;border-radius:3px;box-shadow:0 2px 10px rgba(0,0,0,.12);padding:5px 0}.select-box.open .select-options{display:block}.option{padding:8px 11px;font-size:13px}.option:hover{background:#f5f7fa;color:#409eff}.btn{height:32px;border:1px solid #dcdfe6;border-radius:3px;background:#fff;color:#606266;padding:0 13px;cursor:pointer;font-size:13px}.btn:hover{color:#409eff;border-color:#b3d8ff;background:#ecf5ff}.btn.primary{background:#409eff;color:#fff;border-color:#409eff}.btn.primary:hover{background:#66b1ff}.btn.danger{color:#f56c6c}.toolbar{display:flex;justify-content:space-between;margin-bottom:12px}.toolbar .btn{margin-right:8px}.right-tool{color:#909399;font-size:18px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th{background:#f5f7fa;color:#909399;font-weight:500}.table th,.table td{height:42px;padding:8px 12px;text-align:left;border:1px solid #ebeef5;white-space:nowrap}.table tr:hover td{background:#f5f7fa}.link{color:#409eff;cursor:pointer;margin-right:12px}.tag{padding:3px 7px;border-radius:3px;font-size:12px;display:inline-block}.tag.ok{color:#67c23a;background:#f0f9eb}.tag.info{color:#409eff;background:#ecf5ff}.tag.warn{color:#e6a23c;background:#fdf6ec}.tip{background:#fdf6ec;border:1px solid #faecd8;color:#e6a23c;padding:9px 12px;border-radius:3px;margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.stat{background:#fff;border:1px solid #ebeef5;padding:13px 16px}.stat .k{font-size:13px;color:#909399}.stat .v{font-size:22px;font-weight:600;color:#303133;margin-top:7px}.stat .u{font-size:12px;font-weight:400;color:#909399;margin-left:4px}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.result-title{font-weight:600;font-size:15px;border-left:3px solid #409eff;padding-left:8px;margin-bottom:12px}.result-title.after{border-color:#67c23a}.metric{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #ebeef5}.metric b{font-weight:500}.metric strong{font-size:15px}.green{color:#67c23a}.red{color:#f56c6c}.price-grid{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid #ebeef5;border-left:1px solid #ebeef5;margin-top:10px}.price-cell{padding:7px 9px;border-right:1px solid #ebeef5;border-bottom:1px solid #ebeef5;color:#606266}.price-cell b{font-weight:500;color:#303133}.page-note{padding:10px 12px;background:#f4f4f5;color:#909399;font-size:13px;border-radius:3px;line-height:1.65}.mask{display:none;position:fixed;z-index:20;inset:0;background:rgba(0,0,0,.35);align-items:center;justify-content:center}.mask.show{display:flex}.dialog{width:520px;background:#fff;border-radius:3px;box-shadow:0 6px 18px rgba(0,0,0,.2)}.dialog-hd{padding:15px 18px;border-bottom:1px solid #ebeef5;font-size:16px;font-weight:600}.dialog-bd{padding:18px}.dialog-ft{border-top:1px solid #ebeef5;padding:11px 18px;text-align:right}.dialog-ft .btn{margin-left:8px}.form-row{display:flex;align-items:center;margin-bottom:15px}.form-row label{width:115px;text-align:right;margin-right:12px;color:#606266}.form-row .input{width:300px}.message{display:none;position:fixed;z-index:30;top:75px;left:50%;transform:translateX(-50%);padding:10px 15px;background:#f0f9eb;color:#67c23a;border:1px solid #e1f3d8;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.12)}.message.warning{background:#fdf6ec;color:#e6a23c;border-color:#faecd8}@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.result-grid{grid-template-columns:1fr}.main{min-width:740px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar"><div class="brand"><b>能</b>智慧售电管理系统</div><div class="nav-title">测算配置</div><div class="nav">
    <div class="nav-item" data-view="electricity"><span class="nav-icon">▦</span>客户电量维护</div>
    <div class="nav-item" data-view="plans"><span class="nav-icon">▤</span>客户套餐</div>
    <div class="nav-item" data-view="templates"><span class="nav-icon">▧</span>客户电价模版</div>
    <div class="nav-item active" data-view="calc"><span class="nav-icon">▣</span>套餐推算</div>
  </div></aside>
  <main class="main"><header class="topbar"><div class="crumb">首页 <span>/</span> 测算配置 <span>/</span> <b id="crumb">套餐推算</b></div><div class="user">🔔　管理员 ▾</div></header><div class="tabs"><div class="tab active" id="tab">套餐推算　×</div></div><section class="content" id="view"></section></main>
</div>
<div class="mask" id="mask"><div class="dialog"><div class="dialog-hd" id="dialogTitle">操作</div><div class="dialog-bd" id="dialogBody"></div><div class="dialog-ft"><button class="btn" onclick="closeDialog()">取消</button><button class="btn primary" onclick="confirmDialog()">确定</button></div></div></div>
<div class="message" id="message"></div>
<script>
const hours=Array.from({length:24},(_,i)=>String(i).padStart(2,'0')+':00');
const clientNames=['宁夏示例客户A','宁夏示例客户B'];
const state={view:'calc',client:'宁夏示例客户A',month:'2026-09',change:'峰时调整模版',start:'2026-09-19'};
const basePrice=t=>t>=17&&t<=21?365:t>=8&&t<=11?330:285;
const newPrice=t=>t>=17&&t<=21?405:t>=8&&t<=11?345:295;
const fmt=n=>Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
function showMessage(text,type='ok'){const e=document.querySelector('#message');e.textContent=text;e.className='message '+(type==='warn'?'warning':'');e.style.display='block';setTimeout(()=>e.style.display='none',2800)}
function selected(value,opts,key){return `<div class="select-box" onclick="this.classList.toggle('open')"><span>${value}</span><span class="arrow">▼</span><div class="select-options">${opts.map(x=>`<div class="option" onclick="event.stopPropagation();setValue('${key}','${x}')">${x}</div>`).join('')}</div></div>`}
function clientPicker(){return `<div class="select-box" onclick="this.classList.toggle('open')"><input class="select-input" value="${state.client}" onclick="event.stopPropagation()" oninput="state.client=this.value" title="可直接输入客户名称"><span class="arrow">▼</span><div class="select-options">${clientNames.map(x=>`<div class="option" onclick="event.stopPropagation();setValue('client','${x}')">${x}</div>`).join('')}</div></div>`}
function setValue(key,value){state[key]=value;document.querySelectorAll('.select-box').forEach(x=>x.classList.remove('open'));render()}
function pageShell(title,sub,body){document.querySelector('#crumb').textContent=title;document.querySelector('#tab').textContent=title+'　×';document.querySelector('#view').innerHTML=`<div class="page-head"><div><div class="page-title">${title}</div><div class="subtle">${sub}</div></div></div>${body}`}
function timePriceGrid(fn){return `<div class="price-grid">${hours.map((h,i)=>`<div class="price-cell"><b>${h}</b>　${fmt(fn(i))}</div>`).join('')}</div>`}
function renderElectricity(){pageShell('客户电量维护','维护客户日分时实际电量；客户名称可自由录入，不校验 Kennel 客户库。',`
<section class="panel module-query"><div class="panel-bd"><div class="query"><div class="field"><label>客户名称</label>${selected('全部客户', ['全部客户',...clientNames],'filterClient')}</div><div class="field"><label>月份</label><div class="input">2026-09　📅</div></div><button class="btn primary" onclick="showMessage('已按查询条件刷新')">查询</button><button class="btn" onclick="showMessage('查询条件已重置')">重置</button></div></div></section>
<section class="panel module-list"><div class="panel-bd"><div class="toolbar"><div><button class="btn primary" onclick="openImport()">＋ 导入电量</button><button class="btn" onclick="showMessage('已生成缺失日期模板')">⇩ 导出缺失日期模板</button></div><div class="right-tool">⟳　☷</div></div><div class="page-note">当前客户已上传 15 天（9 月 1 日至 15 日），缺失 9 月 16 日至 30 日。每条导入记录必须包含完整 24 个小时位；缺少小时位将阻断上传。</div><div class="table-wrap"><table class="table"><thead><tr><th>客户名称</th><th>日期</th><th>00:00–01:00</th><th>08:00–09:00</th><th>17:00–18:00</th><th>23:00–24:00</th><th>导入状态</th><th>操作</th></tr></thead><tbody>${[13,14,15].map(d=>`<tr><td>宁夏示例客户A</td><td>2026-09-${d}</td><td>${fmt(4.12+d/100)}</td><td>${fmt(5.38+d/100)}</td><td>${fmt(6.26+d/100)}</td><td>${fmt(3.75+d/100)}</td><td><span class="tag ok">完整</span></td><td><span class="link">查看</span><span class="link">删除</span></td></tr>`).join('')}</tbody></table></div></div></section>`)}
function renderPlans(){pageShell('客户套餐','套餐可复用并关联多个客户；复制套餐后可仅调整指定时段价格。',`
<section class="panel module-query"><div class="panel-bd"><div class="query"><div class="field"><label>套餐名称</label><div class="input">请输入套餐名称</div></div><div class="field"><label>关联客户</label>${selected('全部', ['全部',...clientNames],'pClient')}</div><button class="btn primary" onclick="showMessage('已按查询条件刷新')">查询</button><button class="btn" onclick="showMessage('查询条件已重置')">重置</button></div></div></section>
<section class="panel module-list"><div class="panel-bd"><div class="toolbar"><div><button class="btn primary" onclick="openPlan()">＋ 新增套餐</button></div><div class="right-tool">⟳　☷</div></div><div class="table-wrap"><table class="table"><thead><tr><th>套餐名称</th><th>价格年月</th><th>关联客户数</th><th>客户套餐有效期</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td>常规零售套餐</td><td>2026 年 09 月（24 时段）</td><td>2</td><td>客户A：2026-01-01 至 2026-12-31</td><td><span class="tag ok">启用</span></td><td><span class="link">编辑</span><span class="link" onclick="copyPlan()">复制套餐</span><span class="link">关联客户</span></td></tr><tr><td>峰时优惠套餐</td><td>2026 年 09 月（24 时段）</td><td>1</td><td>客户B：2026-07-01 至 2026-12-31</td><td><span class="tag ok">启用</span></td><td><span class="link">编辑</span><span class="link" onclick="copyPlan()">复制套餐</span><span class="link">关联客户</span></td></tr></tbody></table></div><div class="panel-hd" style="margin-top:14px">常规零售套餐 · 2026 年 09 月分时价格（元/MWh）</div>${timePriceGrid(basePrice)}</div></section>`)}
function renderTemplates(){pageShell('客户电价模版','模版仅维护年、月、分时价格；生效日期在“客户—模版”关联上分别维护。',`
<section class="panel module-query"><div class="panel-bd"><div class="query"><div class="field"><label>模版名称</label><div class="input">请输入模版名称</div></div><div class="field"><label>关联客户</label>${selected('全部', ['全部',...clientNames],'tClient')}</div><button class="btn primary" onclick="showMessage('已按查询条件刷新')">查询</button><button class="btn" onclick="showMessage('查询条件已重置')">重置</button></div></div></section>
<section class="panel module-list"><div class="panel-bd"><div class="toolbar"><div><button class="btn primary" onclick="openTemplate()">＋ 新增电价模版</button></div><div class="right-tool">⟳　☷</div></div><div class="table-wrap"><table class="table"><thead><tr><th>模版名称</th><th>价格年月</th><th>关联客户</th><th>客户生效日期</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td>常规价格模版</td><td>2026 年 09 月（24 时段）</td><td>宁夏示例客户A、客户B</td><td>客户A：2026-09-01；客户B：2026-09-01</td><td><span class="tag ok">生效中</span></td><td><span class="link">编辑</span><span class="link">关联客户</span></td></tr><tr><td>峰时调整模版</td><td>2026 年 09 月（24 时段）</td><td>宁夏示例客户A</td><td>客户A：2026-09-19</td><td><span class="tag info">待生效</span></td><td><span class="link">编辑</span><span class="link">关联客户</span></td></tr></tbody></table></div><div class="page-note" style="margin-top:14px">同一客户同一生效日期只允许关联一个模版。本次改价关联必须在当前月内，且生效日期不得早于 D+2。</div></div></section>`)}
function calculate(){const known=15,days=30;let total=0,cost=0,before=0,after=0;for(let t=0;t<24;t++){const avg=3.8+(t>=17&&t<=21?2.1:t>=8&&t<=11?1.2:0.25)+t*.012;const q=avg*days;const long=q*.62,spot=q-long;total+=q;cost+=long*(t>=17&&t<=21?298:275)+spot*(t>=17&&t<=21?342:315)+q*12.5;before+=q*basePrice(t);after+=q*((18/days)*basePrice(t)+(12/days)*newPrice(t))}return{known,missing:days-known,total,cost,before,after,beforeProfit:before-cost,afterProfit:after-cost}}
function renderCalc(){const r=calculate();const same=state.change==='常规价格模版';const newFn=same?basePrice:newPrice;const changeName=state.change;pageShell('套餐推算','仅推算当前自然月；电量单位 MWh，价格及金额均保留两位小数。',`
<section class="panel"><div class="panel-hd">推算条件</div><div class="panel-bd"><div class="query"><div class="field"><label>客户名称</label>${clientPicker()}</div><div class="field"><label>推算月份</label><div class="input">2026-09　📅</div></div><div class="field"><label>本次改价模版</label>${selected(state.change,['峰时调整模版','常规价格模版'],'change')}</div><div class="field"><label>客户生效日期</label><input class="input" value="${state.start}" oninput="state.start=this.value" title="请输入 YYYY-MM-DD"></div><button class="btn primary" onclick="runCalc()">推算套餐</button><button class="btn" onclick="exportTemplate()">⇩ 导出最终电价模版</button></div></div></section>
${same?'<div class="tip">⚠ 改价模版与当前生效中模版一致</div>':''}
<div class="stats"><div class="stat"><div class="k">已上传日期 / 缺失日期</div><div class="v">${r.known}<span class="u">天</span> / ${r.missing}<span class="u">天</span></div></div><div class="stat"><div class="k">完整月分时总电量</div><div class="v">${fmt(r.total)}<span class="u">MWh</span></div></div><div class="stat"><div class="k">当月总成本（改价前后相同）</div><div class="v">${fmt(r.cost)}<span class="u">元</span></div></div></div>
<section class="panel"><div class="panel-hd">套餐推算结果</div><div class="panel-bd"><div class="result-grid"><div><div class="result-title">改价前</div><div class="metric"><span>价格取值</span><b>常规价格模版（客户关联生效）</b></div><div class="metric"><span>总收入</span><strong>${fmt(r.before)} 元</strong></div><div class="metric"><span>总盈亏</span><strong class="${r.beforeProfit>=0?'green':'red'}">${fmt(r.beforeProfit)} 元</strong></div><div class="metric"><span>度电收入 / 度电盈亏</span><b>${fmt(r.before/r.total)} / ${fmt(r.beforeProfit/r.total)} 元/MWh</b></div></div><div><div class="result-title after">改价后</div><div class="metric"><span>价格取值</span><b>9月1–18日常规模版；9月19–30日${changeName}</b></div><div class="metric"><span>总收入</span><strong>${fmt(r.after)} 元</strong></div><div class="metric"><span>总盈亏</span><strong class="${r.afterProfit>=0?'green':'red'}">${fmt(r.afterProfit)} 元</strong></div><div class="metric"><span>度电收入 / 度电盈亏</span><b>${fmt(r.after/r.total)} / ${fmt(r.afterProfit/r.total)} 元/MWh</b></div></div></div><div class="page-note" style="margin-top:14px">改价影响：<b class="green">+${fmt(r.after-r.before)} 元</b>。本次选择的模版从 9 月 19 日起覆盖计算至月末，后续原模版不再参与本次改价后收入。</div></div></section>
<section class="panel"><div class="panel-hd">收入取价明细</div><div class="panel-bd"><div class="table-wrap"><table class="table"><thead><tr><th>日期区间</th><th>电量类型</th><th>价格来源</th><th>适用时段</th><th>电价（元/MWh）</th><th>收入计算</th></tr></thead><tbody><tr><td>2026-09-01 至 2026-09-15</td><td>实际电量</td><td>常规价格模版</td><td>全部 24 时段</td><td>285.00–365.00</td><td>日分时电量 × 模版价格</td></tr><tr><td>2026-09-16 至 2026-09-18</td><td>补全电量</td><td>常规价格模版</td><td>全部 24 时段</td><td>285.00–365.00</td><td>日均补全电量 × 模版价格</td></tr><tr><td>2026-09-19 至 2026-09-30</td><td>补全电量</td><td>${changeName}</td><td>全部 24 时段</td><td>${same?'285.00–365.00':'295.00–405.00'}</td><td>日均补全电量 × 新模版价格</td></tr></tbody></table></div></div></section>`)}
function runCalc(){if(!clientNames.includes(state.client)){showMessage('未查询到该客户的实际电量，请先在客户电量维护中上传','warn');return}if(state.start<'2026-09-19'){showMessage('本次改价生效日期不得早于 D+2（2026-09-19）','warn');return}showMessage('套餐推算完成，已更新改价前后结果');renderCalc()}
function exportTemplate(){const content=`客户名称,模版名称,客户生效日期,价格年月\n${state.client},${state.change},${state.start},2026-09\n`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));a.download='最终电价模版.csv';a.click();URL.revokeObjectURL(a.href);showMessage('已导出最终电价模版')}
function openImport(){openDialog('导入客户电量',`<div class="page-note">导入字段：客户名称、日期、完整 24 个小时位电量。客户名称可自由填写；缺少任一小时位将阻断上传。</div><div class="form-row" style="margin-top:16px"><label>选择文件</label><div class="input">点击选择 Excel 文件　📎</div></div>`,'import')}
function openPlan(){openDialog('新增套餐',`<div class="form-row"><label>套餐名称</label><div class="input">请输入套餐名称</div></div><div class="form-row"><label>价格年月</label><div class="input">2026 年 09 月　📅</div></div><div class="form-row"><label>关联客户</label><div class="input">可选择多个客户　▼</div></div><div class="page-note">保存后可维护每个客户的套餐生效开始、结束日期。</div>`,'plan')}
function openTemplate(){openDialog('新增电价模版',`<div class="form-row"><label>模版名称</label><div class="input">请输入模版名称</div></div><div class="form-row"><label>价格年月</label><div class="input">2026 年 09 月　📅</div></div><div class="form-row"><label>关联客户</label><div class="input">可选择多个客户　▼</div></div><div class="page-note">模版本身不设置生效日；保存关联客户时，分别填写客户模版生效日期。</div>`,'template')}
function copyPlan(){openDialog('复制套餐',`<div class="form-row"><label>原套餐</label><div class="input">常规零售套餐</div></div><div class="form-row"><label>新套餐名称</label><div class="input">常规零售套餐（复制）</div></div><div class="page-note">复制后生成独立套餐，可仅修改某个分时价格，不影响原套餐；新套餐可关联其他客户。</div>`,'copy')}
let dialogAction='';function openDialog(title,body,action){dialogAction=action;document.querySelector('#dialogTitle').textContent=title;document.querySelector('#dialogBody').innerHTML=body;document.querySelector('#mask').classList.add('show')}function closeDialog(){document.querySelector('#mask').classList.remove('show')}function confirmDialog(){closeDialog();showMessage(dialogAction==='import'?'导入校验通过：示例数据已提交':'保存成功')}
function render(){document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.view===state.view));({electricity:renderElectricity,plans:renderPlans,templates:renderTemplates,calc:renderCalc})[state.view]()}
document.querySelectorAll('.nav-item').forEach(x=>x.onclick=()=>{state.view=x.dataset.view;render()});document.addEventListener('click',e=>{if(!e.target.closest('.select-box'))document.querySelectorAll('.select-box').forEach(x=>x.classList.remove('open'))});render();
</script>
