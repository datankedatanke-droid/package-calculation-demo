const S={p:'calc',tab:'result',f:{electric:{c:'',m:'2026-09'},package:{n:'',c:''},template:{n:'',c:''}},calc:{c:'宁夏示例客户A',m:'2026-09',t:'峰时调整模版',d:'2026-09-19',done:true}};const NM={electric:'客户电量维护',package:'客户套餐',template:'客户电价模版',calc:'套餐推算'};
const e=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));const el=(id,v='',ph='请输入')=>`<div class="input"><input id="${id}" value="${e(v)}" placeholder="${ph}"></div>`;const date=(id,v)=>`<div class="date"><input id="${id}" value="${e(v)}" placeholder="YYYY-MM-DD"><span class="calendar">▣</span></div>`;function sel(id,v,ops){return `<div class="select" id="s-${id}"><span class="val">${e(v||'请选择')}</span><span class="arr">⌄</span><div class="select-menu">${ops.map(x=>`<div class="opt ${x===v?'on':''}" data-v="${e(x)}">${e(x||'全部')}</div>`).join('')}</div></div>`}function sv(id){return document.querySelector('#s-'+id+' .val')?.textContent.trim()||''}function toast(t,k=''){let x=document.querySelector('#toast');x.textContent=(k==='err'?'✖ ':k==='warn'?'⚠ ':'✔ ')+t;x.className='toast '+k;x.style.display='block';clearTimeout(window.tm);window.tm=setTimeout(()=>x.style.display='none',2200)}function head(n){crumb.textContent=n;tags.innerHTML=`<span class="tab" data-tab="calc">套餐推算　×</span><span class="tab active" data-tab="${S.p}">${n}　×</span>`;return `<div class="title">${n}</div>`}function module(h,b){return `<section class="mod">${h?`<div class="mh">${h}</div>`:''}<div class="mb">${b}</div></section>`}
function render(){document.querySelectorAll('#menu li').forEach(x=>x.classList.toggle('active',x.dataset.p===S.p));app.innerHTML=S.p==='calc'?calcPage():listPage(S.p);bind()}
function listPage(k){let q=k==='electric'?`<div class="form"><div class="field"><label>客户名称</label>${sel('qc',S.f.electric.c,['',...DB.clients])}</div><div class="field"><label>年月</label>${sel('qm',S.f.electric.m,['2026-09','2026-08'])}</div><button class="btn primary" data-a="search-${k}">查询</button><button class="btn" data-a="reset-${k}">重置</button></div>`:`<div class="form"><div class="field"><label>${k==='package'?'套餐名称':'模版名称'}</label>${el('qn',S.f[k].n,'请输入名称')}</div><div class="field"><label>关联客户</label>${sel('qc',S.f[k].c,['',...DB.clients])}</div><button class="btn primary" data-a="search-${k}">查询</button><button class="btn" data-a="reset-${k}">重置</button></div>`;let bars=k==='electric'?`<button class="btn primary" data-a="import">＋ 导入电量</button><button class="btn" data-a="download-tpl">⇩ 下载导入模板</button><button class="btn" data-a="export-electric">⇩ 导出</button>`:k==='package'?`<button class="btn primary" data-a="add-package">＋ 新增套餐</button><button class="btn" data-a="batch-package">▣ 批量关联客户</button>`:`<button class="btn primary" data-a="add-template">＋ 新增电价模版</button><button class="btn" data-a="batch-template">▣ 批量关联客户</button>`;return head(NM[k])+module('',q)+module('',`<div class="toolbar"><div>${bars}</div><div class="tools"><button class="btn" data-a="refresh">⟳</button><button class="btn" data-a="columns">⚙</button></div></div>${table(k)}`)}
function table(k){if(k==='electric'){let a=DB.electric.filter(x=>(!S.f.electric.c||x.c===S.f.electric.c)&&x.d.startsWith(S.f.electric.m));if(!a.length)return empty('暂无符合条件的电量数据','import');return `<div class="tablewrap"><table class="table"><thead><tr><th>客户名称</th><th>日期</th><th>00:00–01:00</th><th>08:00–09:00</th><th>12:00–13:00</th><th>17:00–18:00</th><th>20:00–21:00</th><th>23:00–24:00</th><th>状态</th><th>操作</th></tr></thead><tbody>${a.map(x=>`<tr><td>${e(x.c)}</td><td>${x.d}</td>${x.h.map(v=>`<td>${v.toFixed(2)}</td>`).join('')}<td><span class="tag">完整</span></td><td><span class="link" data-a="detail-electric" data-id="${x.id}">查看</span><span class="link red" data-a="del-electric" data-id="${x.id}">删除</span></td></tr>`).join('')}</tbody></table></div>${pager(a.length)}`}
let a=DB[k==='package'?'packages':'templates'].filter(x=>(!S.f[k].n||x.n.includes(S.f[k].n))&&(!S.f[k].c||x.cs.some(c=>c[0]===S.f[k].c)));if(!a.length)return empty('暂无符合条件的数据','add-'+k);let t=k==='package'?`<thead><tr><th>套餐名称</th><th>价格年月</th><th>关联客户数</th><th>客户套餐有效期</th><th>状态</th><th>操作</th></tr></thead><tbody>${a.map(x=>`<tr><td>${e(x.n)}</td><td>${x.m.replace('-','年')}月（24时段）</td><td>${x.cs.length}</td><td>${x.cs.map(c=>`${e(c[0])}：${c[1]} 至 ${c[2]}`).join('<br>')}</td><td><span class="tag">启用</span></td><td><span class="link" data-a="edit-package" data-id="${x.id}">编辑</span><span class="link" data-a="copy-package" data-id="${x.id}">复制套餐</span><span class="link" data-a="assoc-package" data-id="${x.id}">关联客户</span></td></tr>`).join('')}</tbody>`:`<thead><tr><th>模版名称</th><th>价格年月</th><th>关联客户</th><th>客户模版生效日期</th><th>状态</th><th>操作</th></tr></thead><tbody>${a.map(x=>`<tr><td>${e(x.n)}</td><td>${x.m.replace('-','年')}月（24时段）</td><td>${x.cs.map(c=>e(c[0])).join('、')}</td><td>${x.cs.map(c=>`${e(c[0])}：${c[1]}`).join('<br>')}</td><td><span class="tag ${x.id===2?'warn':''}">${x.id===2?'待生效':'生效中'}</span></td><td><span class="link" data-a="edit-template" data-id="${x.id}">编辑</span><span class="link" data-a="assoc-template" data-id="${x.id}">关联客户</span><span class="link" data-a="detail-template" data-id="${x.id}">查看</span></td></tr>`).join('')}</tbody>`;return `<div class="tablewrap"><table class="table">${t}</table></div>${pager(a.length)}`}
function pager(n){return `<div class="pager"><span>共 ${n} 条</span><button class="pg" disabled>‹</button><button class="pg on">1</button><button class="pg" disabled>›</button><span>10条/页⌄</span><span>前往</span>${el('jump',1,'') }<span>页</span></div>`}function empty(t,a){return `<div class="empty"><b>▧</b>${t}<br><button class="btn primary" style="margin-top:12px" data-a="${a}">立即操作</button></div>`}
function active(c){const today='2026-09-17';return DB.templates.filter(t=>t.cs.some(x=>x[0]===c&&x[1]<=today)).sort((a,b)=>b.cs.find(x=>x[0]===c)[1].localeCompare(a.cs.find(x=>x[0]===c)[1]))[0]}function calcPage(){let c=S.calc,at=active(c.c),available=DB.templates.filter(t=>t.cs.some(x=>x[0]===c.c)).map(x=>x.n),same=at&&at.n===c.t;return head('套餐推算')+module('客户信息',`<div class="form"><div class="field"><label>客户名称</label>${sel('cc',c.c,DB.clients)}</div><div class="field"><label>推算月份</label>${sel('cm',c.m,['2026-09','2026-08'])}</div><div class="field"><label>当前生效模版</label><div class="input"><span class="val">${at?e(at.n):'无，按套餐取价'}</span></div></div><div class="field"><label>实际电量日期</label><div class="input"><span class="val">${range(c.c,c.m)}</span></div></div></div>`)+module('套餐情况',`<div class="form"><div class="field"><label>本次改价模版</label>${sel('ct',c.t,available)}</div><div class="field"><label>客户生效日期</label>${date('cd',c.d)}</div><button class="btn primary" data-a="calc">推算套餐</button><button class="btn" data-a="export-final">导出最终电价模版</button></div><div class="hint">仅可选择已关联当前客户的电价模版。仅推算当月；改价模版从客户生效日期起覆盖至月末；成本按系统配置价格计算，改价前后不变。</div>`)+(same?`<div class="notice">⚠ 改价模版与当前生效中模版一致</div>`:'')+(c.done?calcResult():empty('请设置改价模版与客户生效日期后，点击“推算套餐”。','calc'))}function range(c,m){let a=DB.electric.filter(x=>x.c===c&&x.d.startsWith(m)).map(x=>x.d).sort();return a.length?`${a[0]} 至 ${a[a.length-1]}（已上传 ${a.length} 天）`:'未上传'}function calcResult(){let impact=S.calc.t==='峰时调整模版'?25885.2:0;return module('套餐推算结果',`<div class="tabs"><span class="${S.tab==='result'?'on':''}" data-a="tab-result">推算结果</span><span class="${S.tab==='detail'?'on':''}" data-a="tab-detail">收入取价明细</span></div>${S.tab==='detail'?detail():`<div class="summary"><div><label>已上传日期</label><b>15 天</b></div><div><label>缺失日期</label><b>15 天</b></div><div><label>完整月分时总电量</label><b>3,406.86 MWh</b></div><div><label>当月总成本</label><b>1,053,795.31 元</b></div><div><label>补全规则</label><b>同小时位日均补全</b></div><div><label>成本口径</label><b>改价前后相同</b></div></div><div class="formula">补全日分时电量 = 已知日期内同一小时位电量之和 ÷ 已知天数；完整月分时电量 = 已上传日分时电量 + 缺失日期补全电量。</div><div class="tablewrap"><table class="table"><thead><tr><th>指标</th><th>改价前</th><th>改价后</th><th>改价影响</th></tr></thead><tbody><tr><td>总收入（元）</td><td>1,072,106.70</td><td>${(1072106.7+impact).toFixed(2)}</td><td class="${impact?'':'red'}">+${impact.toFixed(2)}</td></tr><tr><td>总成本（元）</td><td>1,053,795.31</td><td>1,053,795.31</td><td>0.00</td></tr><tr><td>总盈亏（元）</td><td>18,311.39</td><td>${(18311.39+impact).toFixed(2)}</td><td>+${impact.toFixed(2)}</td></tr><tr><td>度电收入（元/MWh）</td><td>314.69</td><td>${(314.69+impact/3406.86).toFixed(2)}</td><td>+${(impact/3406.86).toFixed(2)}</td></tr><tr><td>度电盈亏（元/MWh）</td><td>5.37</td><td>${(5.37+impact/3406.86).toFixed(2)}</td><td>+${(impact/3406.86).toFixed(2)}</td></tr></tbody></table></div>`}`)}function detail(){let d=S.calc.d,t=DB.templates.find(x=>x.n===S.calc.t),last=(+d.slice(-2)-1+'').padStart(2,'0');return `<div class="tablewrap"><table class="table"><thead><tr><th>日期区间</th><th>电量类型</th><th>价格来源</th><th>适用时段</th><th>电价（元/MWh）</th><th>收入计算</th></tr></thead><tbody><tr><td>2026-09-01 至 2026-09-15</td><td>实际电量</td><td>常规价格模版</td><td>全部24时段</td><td>285.00–365.00</td><td>日分时电量 × 模版价格</td></tr><tr><td>2026-09-16 至 2026-09-${last}</td><td>补全电量</td><td>常规价格模版</td><td>全部24时段</td><td>285.00–365.00</td><td>日均补全电量 × 模版价格</td></tr><tr><td>${d} 至 2026-09-30</td><td>补全电量</td><td>${e(t.n)}</td><td>全部24时段</td><td>${Math.min(...t.p).toFixed(2)}–${Math.max(...t.p).toFixed(2)}</td><td>日均补全电量 × 新模版价格</td></tr></tbody></table></div>`}
function bind(){document.querySelectorAll('.select').forEach(x=>x.onclick=ev=>{if(!ev.target.classList.contains('opt'))x.classList.toggle('open')});document.querySelectorAll('.opt').forEach(x=>x.onclick=()=>{let box=x.closest('.select'),id=box.id.slice(2);box.querySelector('.val').textContent=x.dataset.v;box.classList.remove('open');picked(id,x.dataset.v)});document.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>act(x.dataset.a,x.dataset.id));document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{S.p=x.dataset.tab;render()});menu.onclick=ev=>{let x=ev.target.closest('li');if(x){S.p=x.dataset.p;render()}}}function picked(id,v){if(id==='qc')S.f[S.p].c=v;if(id==='qm')S.f.electric.m=v;if(id==='cc'){S.calc.c=v;let ts=DB.templates.filter(t=>t.cs.some(x=>x[0]===v));S.calc.t=ts[0]?.n||'';S.calc.done=false}if(id==='cm'){S.calc.m=v;S.calc.done=false}if(id==='ct'){S.calc.t=v;S.calc.done=false}render()}
function act(a,id){if(a==='refresh')return toast('列表已刷新');if(a==='columns')return dialog('列设置',`<div class="hint">选择列表中需要展示的字段。</div><div class="divide"></div>${['名称','价格年月','关联客户','生效日期','状态','操作'].map((x,i)=>`<p><input type="checkbox" checked id="co${i}"> <label for="co${i}">${x}</label></p>`).join('')}`,()=>{close();toast('列设置已保存')});if(a.startsWith('search-')){let k=a.slice(7);if(k==='electric')S.f.electric.c=sv('qc');else{S.f[k].n=document.querySelector('#qn').value.trim();S.f[k].c=sv('qc')}render();return toast('查询完成')}if(a.startsWith('reset-')){let k=a.slice(6);S.f[k]=k==='electric'?{c:'',m:'2026-09'}:{n:'',c:''};render();return toast('已重置查询条件')}if(a==='import')return importBox();if(a==='download-tpl'){down('客户电量导入模板.csv','客户名称,年月日,00:00-01:00,...,23:00-24:00\n宁夏示例客户A,2026-09-16,0.00,...,0.00');return toast('已下载导入模板')}if(a==='export-electric'){down('客户电量数据.csv','客户名称,日期,状态\n'+DB.electric.map(x=>`${x.c},${x.d},完整`).join('\n'));return toast('电量数据已导出')}if(a==='detail-electric')return electricDetail(+id);if(a==='del-electric')return confirmBox('确认删除该条日分时电量？','删除后将影响本月电量补全和推算结果。',()=>{DB.electric=DB.electric.filter(x=>x.id!==+id);close();render();toast('已删除')});if(a==='add-package')return objectBox('package');if(a==='edit-package')return objectBox('package',DB.packages.find(x=>x.id===+id));if(a==='copy-package'){let x=DB.packages.find(x=>x.id===+id);return objectBox('package',{...x,id:null,n:x.n+'（复制）'})}if(a==='add-template')return objectBox('template');if(a==='edit-template')return objectBox('template',DB.templates.find(x=>x.id===+id));if(a==='detail-template')return templateDetail(+id);if(a==='assoc-package'||a==='assoc-template')return associate(a.split('-')[1],+id);if(a==='batch-package'||a==='batch-template')return batch(a.split('-')[1]);if(a==='calc'){let c=sv('cc'),t=sv('ct'),d=document.querySelector('#cd').value.trim();if(!DB.electric.some(x=>x.c===c&&x.d.startsWith(S.calc.m)))return toast('未查询到该客户当月实际电量，请先导入','err');if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!d.startsWith(S.calc.m))return toast('请输入推算月内的客户生效日期（YYYY-MM-DD）','err');S.calc={...S.calc,c,t,d,done:true};S.tab='result';render();return toast('套餐推算完成')}if(a==='export-final'){let t=DB.templates.find(x=>x.n===S.calc.t);down('最终电价模版.csv','客户名称,模版名称,客户生效日期,小时位,电价（元/MWh）\n'+t.p.map((p,i)=>`${S.calc.c},${t.n},${S.calc.d},${String(i).padStart(2,'0')}:00,${p.toFixed(2)}`).join('\n'));return toast('已导出最终电价模版')}if(a==='tab-result'){S.tab='result';return render()}if(a==='tab-detail'){S.tab='detail';return render()}}
function shell(t,b,yes,drawer=false){box.innerHTML=`<div class="${drawer?'drawer':'dialog'}"><div class="xd"><span>${t}</span><span class="x" id="closeX">×</span></div><div class="bd">${b}</div>${yes?`<div class="ft"><button class="btn" id="cancel">取消</button><button class="btn primary" id="ok">确定</button></div>`:''}</div>`;mask.classList.add('show');closeX.onclick=close;if(cancel)cancel.onclick=close;if(yes)ok.onclick=yes}function dialog(t,b,yes){shell(t,b,yes)}function close(){mask.classList.remove('show');box.innerHTML=''}function price(p=[]){return `<div class="prices">${Array.from({length:24},(_,i)=>`<div class="price"><label>${String(i).padStart(2,'0')}时</label>${el('pr'+i,p[i]??'','0.00')}</div>`).join('')}</div>`}function readP(){let a=[];for(let i=0;i<24;i++){let x=document.querySelector('#pr'+i).value;if(x===''||isNaN(x)||+x<0)return;a.push(+x)}return a}
function objectBox(k,x){let isP=k==='package',edit=!!x;shell(edit?(x.id?'编辑':'复制')+(isP?'套餐':'电价模版'):'新增'+(isP?'套餐':'电价模版'),`<div class="row"><label><span class="req">*</span>${isP?'套餐':'模版'}名称</label>${el('name',x?.n||'','请输入名称')}</div><div class="row"><label><span class="req">*</span>价格年月</label>${sel('month',x?.m||'2026-09',['2026-09','2026-08'])}</div><div class="row"><label><span class="req">*</span>月分时价格</label><div>${price(x?.p)}<div class="hint">共24个小时位，单位元/MWh，保留两位小数。${isP?'套餐可关联多个客户。':'模版生效日期由客户关联关系维护。'}</div></div></div>`,()=>{let n=document.querySelector('#name').value.trim(),p=readP();if(!n||!p)return toast('请完整填写名称和24个小时位价格','err');let A=DB[isP?'packages':'templates'];if(x?.id)Object.assign(A.find(q=>q.id===x.id),{n,m:sv('month'),p});else A.push({id:Date.now(),n,m:sv('month'),p,cs:x?.cs||[]});close();render();toast(edit?'保存成功':'新增成功')},true)}
function associate(k,id){let A=DB[k==='package'?'packages':'templates'],x=A.find(q=>q.id===id),p=k==='package';shell(`关联客户｜${e(x.n)}`,`<div class="row"><label><span class="req">*</span>客户名称</label>${sel('ac','',DB.clients)}</div><div class="row"><label><span class="req">*</span>${p?'有效开始日期':'客户生效日期'}</label>${date('as',p?'2026-09-01':'2026-09-19')}</div>${p?`<div class="row"><label><span class="req">*</span>有效结束日期</label>${date('ae','2026-12-31')}</div>`:''}<div class="notice">${p?'同一客户的套餐有效期不能交叉。':'新建客户-模版关联时，生效日期需满足 D+2；同一客户、同一生效日期仅可关联一个模版。'}</div><div class="hint">已关联：${x.cs.length?x.cs.map(c=>p?`${c[0]}（${c[1]} 至 ${c[2]}）`:`${c[0]}（${c[1]}）`).join('；'):'暂无'}</div>`,()=>{let c=sv('ac'),s=document.querySelector('#as').value.trim(),z=p?document.querySelector('#ae').value.trim():'';if(!c||!s||(p&&!z))return toast('请完整填写关联信息','err');if(!p&&s<'2026-09-19')return toast('客户模版生效日期需满足 D+2（2026-09-19）','err');if(x.cs.some(q=>q[0]===c&&(p?!(z<q[1]||s>q[2]):q[1]===s)))return toast(p?'该客户套餐有效期与已有记录交叉':'该客户在此生效日期已关联电价模版','err');x.cs.push(p?[c,s,z]:[c,s]);close();render();toast('客户关联成功')},true)}
function batch(k){let A=DB[k==='package'?'packages':'templates'];dialog('批量关联客户',`<div class="row"><label>选择对象</label>${sel('bi','',A.map(x=>x.n))}</div><div class="row"><label>选择客户</label><div>${DB.clients.map((x,i)=>`<p><input type="checkbox" value="${x}" id="bc${i}"> <label for="bc${i}">${x}</label></p>`).join('')}</div></div>`,()=>{let x=A.find(q=>q.n===sv('bi')),cs=[...box.querySelectorAll('input[type=checkbox]:checked')].map(q=>q.value);if(!x||!cs.length)return toast('请选择对象和至少一名客户','err');cs.forEach(c=>{if(!x.cs.some(q=>q[0]===c))x.cs.push(k==='package'?[c,'2026-09-01','2026-12-31']:[c,'2026-09-19'])});close();render();toast('批量关联完成，请按需调整生效日期')})}
function importBox(){dialog('导入日分时电量',`<div class="upload" id="up">⇧<br><b>点击选择文件</b><br><span class="hint">或将文件拖到此处</span><input class="hidden" id="filein" type="file" accept=".xlsx,.xls,.csv"></div><div class="hint">支持 .xlsx、.xls、.csv；必须包含客户名称、年月日及全部24个小时位电量。</div><div id="files"></div>`,()=>{let f=filein.files[0];if(!f)return toast('请先选择导入文件','err');DB.electric.unshift({id:Date.now(),c:'宁夏示例客户A',d:'2026-09-16',h:[4.2,5.49,5.8,6.34,5.57,3.84]});close();S.p='electric';render();toast('导入成功：1条日分时电量已校验通过')});up.onclick=()=>filein.click();filein.onchange=()=>{let f=filein.files[0];files.innerHTML=f?`<div class="file">▤ ${e(f.name)} <span class="link" id="rmfile">删除</span></div>`:'';if(rmfile)rmfile.onclick=()=>{filein.value='';files.innerHTML=''}}}
function electricDetail(id){let x=DB.electric.find(q=>q.id===id);dialog('日分时电量详情',`<div class="summary"><div><label>客户名称</label><b>${e(x.c)}</b></div><div><label>日期</label><b>${x.d}</b></div><div><label>上传状态</label><b><span class="tag">完整</span></b></div></div><div class="tablewrap"><table class="table"><thead><tr><th>小时位</th>${x.h.map((_,i)=>`<th>${String(i).padStart(2,'0')}:00</th>`).join('')}</tr></thead><tbody><tr><td>电量（MWh）</td>${x.h.map(v=>`<td>${v.toFixed(2)}</td>`).join('')}</tr></tbody></table></div><div class="hint">演示仅展示部分小时位；实际导入校验全部24小时位，缺失时阻断上传。</div>`)}function templateDetail(id){let x=DB.templates.find(q=>q.id===id);dialog('电价模版详情',`<div class="summary"><div><label>模版名称</label><b>${e(x.n)}</b></div><div><label>价格年月</label><b>${x.m}</b></div><div><label>关联客户数</label><b>${x.cs.length}</b></div></div><div class="prices">${x.p.map((v,i)=>`<div class="price"><label>${String(i).padStart(2,'0')}时</label><b>${v.toFixed(2)}</b></div>`).join('')}</div>`)}function confirmBox(t,b,yes){dialog(t,`<div style="padding:8px 0">${b}</div>`,yes);ok.classList.add('danger');ok.textContent='确认删除'}function down(n,s){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv;charset=utf-8'}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
document.addEventListener('click',x=>{if(!x.target.closest('.select'))document.querySelectorAll('.select.open').forEach(q=>q.classList.remove('open'));if(x.target===mask)close()});fold.onclick=()=>{side.classList.toggle('fold');layout.classList.toggle('fold')};render();
</script></body></html>
